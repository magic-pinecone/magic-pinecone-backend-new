[project]
name = "magic-pinecone-backend-new"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic==1.19.1",
    "celery==5.6.3",
    "fastapi>=0.141.1",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "sqlmodel==0.0.39",
    "uvicorn>=0.52.3",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "celery-types>=0.26.0",
    "httpx>=0.28.1",
    "selectolax>=0.4.11",
    "lxml>=6.1.1",
    "tenacity>=9.1.4",
    "beautifulsoup4>=4.15.0",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["E501"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

